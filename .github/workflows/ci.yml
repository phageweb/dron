name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  nix-dev-shell:
    name: Nix dev shell and ROS smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check --show-trace

      - name: Run CI script inside dev shell
        run: nix develop -c scripts/ci.sh
