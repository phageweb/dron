# Template, not a finished config: @world@ is replaced with the name of the
# world actually being launched. The sensors no longer name their own topics,
# because a sensor that does also names the world in it and pins the model to
# one scene - see the comment in models/openipc_cinewhoop/model.sdf. Gazebo's
# default names are what is written below, with the real world substituted, and
# gazebo.launch.py does the substituting.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/openipc_cinewhoop/imu"
  gz_topic_name: "/world/@world@/model/openipc_cinewhoop/link/imu_link/sensor/imu_ros/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/openipc_cinewhoop/scan/front"
  gz_topic_name: "/world/@world@/model/openipc_cinewhoop/link/front_lidar_link/sensor/front_lidar/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# The logical /openipc_cinewhoop/range/down is a sensor_msgs/msg/Range, which is
# what the MTF-02P's driver publishes on hardware. Gazebo can only produce a
# LaserScan, so it lands here and range_adapter owns the logical name.
- ros_topic_name: "/openipc_cinewhoop/range/down_raw"
  gz_topic_name: "/world/@world@/model/openipc_cinewhoop/link/rangefinder_link/sensor/down_range/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/openipc_cinewhoop/camera/image_raw"
  gz_topic_name: "/world/@world@/model/openipc_cinewhoop/link/camera_link/sensor/front_camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/openipc_cinewhoop/camera/camera_info"
  gz_topic_name: "/world/@world@/model/openipc_cinewhoop/link/camera_link/sensor/front_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
